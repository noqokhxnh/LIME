<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to Video Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
            <h1>HTML to Video Generator</h1>
            <p class="subtitle">Nhập ý tưởng để AI tự động tạo chuyển động HTML và render video MP4</p></div>
            <button id="login-open-btn" class="header-login-btn" type="button">Đăng nhập</button>
        </header>

        <div class="main-grid">
            <!-- Cột trái: Nhập prompt và xem log -->
            <div class="card left-panel">
                <div class="form-group">
                    <label for="prompt-input">Prompt / Ý tưởng video:</label>
                    <textarea 
                        id="prompt-input" 
                        placeholder="Nhập ít nhất 10 ký tự. Ví dụ: Video giới thiệu du lịch vịnh Hạ Long 3 cảnh đẹp kỳ vĩ..."
                    ></textarea>
                </div>

                <div class="quick-prompts">
                    <button type="button" class="btn-chip" onclick="setPrompt('Video giới thiệu du lịch vịnh Hạ Long 3 cảnh đẹp kỳ vĩ')">🏝️ Hạ Long</button>
                    <button type="button" class="btn-chip" onclick="setPrompt('Video giới thiệu phố cổ Hà Nội ngàn năm văn hiến')">🏮 Hà Nội</button>
                    <button type="button" class="btn-chip" onclick="setPrompt('Video đồ họa công nghệ trí tuệ nhân tạo AI tương lai 2026')">🤖 Công nghệ AI</button>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="tts-provider-select">Bộ chuyển văn bản thành giọng nói (TTS Engine):</label>
                    <select id="tts-provider-select" style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-size: 14px;">
                        <option value="vieneu" selected>VieNeu-TTS (Local AI - 100% Tự chủ, Siêu nhẹ)</option>
                        <option value="edge">Edge TTS (Microsoft Cloud - Miễn phí)</option>
                        <option value="openai">OpenAI TTS</option>
                        <option value="elevenlabs">ElevenLabs AI</option>
                    </select>
                </div>

                <div class="form-group" id="voice-select-group">
                    <label for="voice-select">Giọng đọc / Nhân vật:</label>
                    <select id="voice-select" style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-size: 14px;">
                        <optgroup label="VieNeu-TTS (Local AI - 11 giọng đọc chuẩn)">
                            <option value="Minh Quân" selected>Minh Quân (Nam · Bắc · Tự nhiên)</option>
                            <option value="Mai Anh">Mai Anh (Nữ · Bắc · Tin tức)</option>
                            <option value="Adam">Adam (Nam · Nam · Tự nhiên)</option>
                            <option value="Ái Hân">Ái Hân (Nữ · Nam · Tin tức)</option>
                            <option value="Mỹ Duyên">Mỹ Duyên (Nữ · Bắc · Đọc truyện)</option>
                            <option value="Đức Trí">Đức Trí (Nam · Bắc · Đọc truyện)</option>
                            <option value="Hữu Quân">Hữu Quân (Nam · Bắc · Tin tức)</option>
                            <option value="Xuân Tiên">Xuân Tiên (Nữ · Bắc · Tin tức)</option>
                            <option value="Trúc Ly">Trúc Ly (Nữ · Bắc · Tự nhiên)</option>
                            <option value="Anh Khôi">Anh Khôi (Nam · Bắc · Kể chuyện)</option>
                            <option value="Mạnh Dũng">Mạnh Dũng (Nam · Bắc · Tự nhiên)</option>
                        </optgroup>
                        <optgroup label="Edge TTS (Cloud)">
                            <option value="vi-VN-HoaiMyNeural">Hoài My (Nữ · Bắc)</option>
                            <option value="vi-VN-NamMinhNeural">Nam Minh (Nam · Bắc)</option>
                        </optgroup>
                    </select>
                </div>

                <button id="generate-btn" class="btn-primary" style="margin-top: 15px;">
                    <span id="btn-spinner" class="spinner"></span>
                    <span id="btn-text">Tạo Video</span>
                </button>

                <div class="log-section">
                    <div class="log-header">
                        <span>Nhật ký (Logs):</span>
                        <span id="progress-percent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="progress-bar-fill" class="progress-bar-fill"></div>
                    </div>
                    <div id="log-viewer" class="log-box">
                        <div class="log-item info">[Hệ thống] Sẵn sàng nhận prompt.</div>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Khung hiển thị Video -->
            <div class="card right-panel">
                <label>Video đầu ra:</label>
                <div class="video-wrapper">
                    <div id="video-empty" class="video-empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span>Chưa có video. Nhập prompt và nhấn "Tạo Video".</span>
                    </div>
                    <video id="video-player" controls playsinline></video>
                </div>
                <div class="video-actions">
                    <a id="btn-download" class="btn-action" style="display: none;" download>
                        ⬇️ Tải file MP4
                    </a>
                    <a id="btn-preview-html" class="btn-action secondary" style="display: none;" target="_blank">
                        🌐 Xem bản HTML
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div id="login-modal" class="login-modal">
        <div class="login-card">
        <button id="login-close-btn" class="login-close-btn" type="button">X</button>
        <h2>Đăng nhập</h2>
        <div class="login-field">
            <label for="login-username">Tên đăng nhập</label>
            <input id="login-username" type="text"placeholder="Nhập tên đăng nhập">
        </div>
        <div class="login-field">
            <label for="login-password">Mật khẩu</label>
            <input id="login-password"type="password"placeholder="Nhập mật khẩu">
        </div>
        <button id="login-submit-btn" class="login-submit-btn" type="button">Đăng nhập</button>
        <p id="login-message"></p>
    </div>
</div>
    <script src="app.js"></script>
</body>
</html>

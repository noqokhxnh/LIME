services:
  redis:
    image: redis:7-alpine
    container_name: lime_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:13
    container_name: lime_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-vidtml}
      - POSTGRES_USER=${POSTGRES_USER:-vidtml}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vidtml}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  vieneu-tts:
    build:
      context: ./services/vieneu-tts
      dockerfile: Dockerfile
    container_name: lime_vieneu_tts
    ports:
      - "7860:7860"
    volumes:
      - ./services/vieneu-tts/server.py:/app/server.py
    restart: unless-stopped

  server:
    build: .
    image: lime_app:latest
    container_name: lime_server
    command: npm run dev
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lime_data:/app/tmp
      - ./src:/app/src
      - ./frontend:/app/frontend
    environment:
      - REDIS_URL=redis://redis:6379
      - QUEUE_TYPE=redis
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vidtml}:${POSTGRES_PASSWORD:-vidtml}@postgres:5432/${POSTGRES_DB:-vidtml}
      - VIENEU_TTS_URL=http://vieneu-tts:7860
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  worker:
    build: .
    image: lime_app:latest
    container_name: lime_worker
    command: npm run worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lime_data:/app/tmp
      - ./src:/app/src
    environment:
      - REDIS_URL=redis://redis:6379
      - QUEUE_TYPE=redis
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vidtml}:${POSTGRES_PASSWORD:-vidtml}@postgres:5432/${POSTGRES_DB:-vidtml}
      - VIENEU_TTS_URL=http://vieneu-tts:7860
    shm_size: 2gb
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

volumes:
  redis_data:
  lime_data:
  postgres_data:

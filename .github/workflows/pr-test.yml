name: PR Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PR Suite + Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Khớp với môi trường phát triển (và @types/node ^26) để hành vi của
          # coverage/glob không lệch giữa máy dev và CI.
          node-version: 26

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Setup fonttools (pyftsubset)
        run: |
          pipx install "fonttools[woff,unicode]" || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonttools python3-brotli python3-zopfli)
          sudo apt-get install -y --no-install-recommends python3-fonttools python3-brotli || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          which pyftsubset || echo "pyftsubset not in PATH"

      - name: Cache Node Modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --prefer-offline

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium & Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (when cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: TypeScript Build Check
        run: npm run build

      - name: Run PR test suite with coverage gate
        # Nhóm `pr` = test nhanh + test tích hợp rẻ + test giao diện (xem
        # scripts/test-groups.ts). Cổng chất lượng lấy từ scripts/coverage-thresholds.json.
        # Không cấu hình service PostgreSQL ⇒ suite chạy ở chế độ in-memory.
        # `pipefail` để cổng chất lượng làm đỏ PR, không bị `tee` che mất mã thoát.
        run: |
          set -o pipefail
          npm run test:coverage:pr 2>&1 | tee coverage-report.txt

      - name: Đưa báo cáo độ phủ vào Step Summary
        if: always()
        run: |
          {
            echo "### Độ phủ mã nguồn — nhóm \`pr\`"
            echo ''
            echo '(ngưỡng: xem `scripts/coverage-thresholds.json`; báo cáo đầy đủ ở artifact + bảng chi tiết trong log)'
            echo ''
            echo '```'
            # Bỏ dòng kẻ và cắt bớt cột "dòng chưa phủ" cho dễ đọc trên trang PR.
            sed -n '/start of coverage report/,/end of coverage report/p' coverage-report.txt \
              | sed 's/^ℹ *//' | grep -v '^-\{5,\}' | cut -c1-140
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pr
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

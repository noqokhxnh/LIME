name: Pipeline Tests (heavy)

# Nhóm test nặng: mở Chromium thật, ghép video bằng ffmpeg hoặc chạy trọn pipeline
# nhiều lần (xem scripts/run-unit-tests.ts). Nhóm này mất hàng chục phút nên KHÔNG
# chạy cho PR thường ngày — chỉ khi PR vào `main` (mốc phát hành), theo lịch đêm,
# hoặc khi chạy thủ công.
on:
  pull_request:
    branches:
      - main
  schedule:
    # 17:00 UTC = 00:00 giờ Việt Nam, mỗi ngày.
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heavy:
    name: Heavy Unit Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Chia 3 lát chạy song song; mỗi lát vẫn cần dư thời gian vì runner CI yếu hơn
    # máy phát triển nhiều lần.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Setup fonttools (pyftsubset)
        run: |
          pipx install "fonttools[woff,unicode]" || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonttools python3-brotli python3-zopfli)
          sudo apt-get install -y --no-install-recommends python3-fonttools python3-brotli || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          which pyftsubset || echo "pyftsubset not in PATH"

      - name: Cache Node Modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --prefer-offline

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium & Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (when cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: TypeScript Build Check
        run: npm run build

      - name: Run Heavy Unit Tests
        # Không cấu hình service PostgreSQL ⇒ suite chạy ở chế độ in-memory.
        run: npx tsx scripts/run-unit-tests.ts heavy:${{ matrix.shard }}

name: Pipeline Tests (heavy, coverage gate, PostgreSQL)

# Nhóm test nặng: mở Chromium thật, ghép video bằng ffmpeg hoặc chạy trọn pipeline
# nhiều lần (xem scripts/test-groups.ts). Nhóm này mất hàng chục phút nên KHÔNG chạy
# cho PR thường ngày — chỉ khi PR vào `main` (mốc phát hành), theo lịch đêm, hoặc khi
# chạy thủ công.
#
# Cổng chất lượng độ phủ (ngưỡng 70% dòng, xem scripts/coverage-thresholds.json) cũng
# nằm ở đây: chạy cả bộ test trong MỘT tiến trình kèm đo độ phủ mất hơn 10 phút trên máy
# phát triển (lâu hơn nữa trên runner CI) nên thay bằng cách cho từng lát chạy kèm
# coverage rồi gộp lại ở job `coverage-gate` — hợp của các lát chính là toàn bộ suite.
on:
  pull_request:
    branches:
      - main
  schedule:
    # 17:00 UTC = 00:00 giờ Việt Nam, mỗi ngày.
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heavy:
    name: Heavy Unit Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Chia 3 lát chạy song song; mỗi lát vẫn cần dư thời gian vì runner CI yếu hơn
    # máy phát triển nhiều lần, và nay còn thêm chi phí đo độ phủ.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Setup fonttools (pyftsubset)
        run: |
          pipx install "fonttools[woff,unicode]" || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonttools python3-brotli python3-zopfli)
          sudo apt-get install -y --no-install-recommends python3-fonttools python3-brotli || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          which pyftsubset || echo "pyftsubset not in PATH"

      - name: Cache Node Modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --prefer-offline

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium & Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (when cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: TypeScript Build Check
        run: npm run build

      - name: Run Heavy Unit Tests (with coverage)
        # --threshold=0: từng lát không tự chấm điểm, việc chấm điểm do job
        # `coverage-gate` làm trên báo cáo gộp (một lát riêng lẻ luôn thiếu độ phủ).
        run: npx tsx scripts/run-unit-tests.ts heavy:${{ matrix.shard }} --coverage --threshold=0 --coverage-out=coverage/parts/heavy-${{ matrix.shard }}.info

      - name: Upload coverage part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov-heavy-${{ matrix.shard }}
          path: coverage/parts/
          if-no-files-found: warn
          retention-days: 7

  pr-coverage:
    name: PR suite (phần độ phủ)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Setup fonttools (pyftsubset)
        run: |
          pipx install "fonttools[woff,unicode]" || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonttools python3-brotli python3-zopfli)
          sudo apt-get install -y --no-install-recommends python3-fonttools python3-brotli || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          which pyftsubset || echo "pyftsubset not in PATH"

      - name: Cache Node Modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --prefer-offline

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium & Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (when cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run PR suite with coverage
        # Đây là lát "fast + integration + frontend" của báo cáo gộp.
        run: npm run test:coverage:pr -- --threshold=0 --coverage-out=coverage/parts/pr.info

      - name: Upload coverage part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov-pr
          path: coverage/parts/
          if-no-files-found: warn
          retention-days: 7

  coverage-gate:
    name: Coverage Gate (gộp 4 lát, ngưỡng 70%)
    runs-on: ubuntu-latest
    needs:
      - heavy
      - pr-coverage
    # Vẫn chạy khi một lát lỗi để báo cáo rõ ràng; `--expect-parts=4` bảo đảm thiếu lát
    # thì job này đỏ chứ không kết luận "đạt" trên báo cáo khuyết.
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Download coverage parts
        uses: actions/download-artifact@v4
        with:
          pattern: cov-*
          merge-multiple: true
          path: coverage/parts

      - name: Gộp báo cáo và kiểm tra cổng chất lượng
        run: |
          set -o pipefail
          npx tsx scripts/merge-coverage.ts coverage/parts --expect-parts=4 2>&1 | tee coverage-merged.txt

      - name: Đưa báo cáo vào Step Summary
        if: always()
        run: |
          {
            echo "### Độ phủ mã nguồn — toàn bộ suite (gộp 4 lát)"
            echo ''
            echo '(ngưỡng: xem `scripts/coverage-thresholds.json`)'
            echo ''
            echo '```'
            cat coverage-merged.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  postgres:
    name: PR suite on real PostgreSQL
    runs-on: ubuntu-latest
    # CI thường chỉ chạy in-memory ⇒ các nhánh truy vấn thật (admin, billing) không
    # được kiểm chứng. Job này chạy đúng nhóm của PR nhưng trên PostgreSQL thật.
    timeout-minutes: 60
    services:
      postgres:
        # Cùng phiên bản với docker-compose.yml của dự án.
        image: postgres:13
        env:
          POSTGRES_DB: vidtml
          POSTGRES_USER: vidtml
          POSTGRES_PASSWORD: vidtml
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidtml -d vidtml"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vidtml:vidtml@localhost:5432/vidtml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Cache Node Modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --prefer-offline

      - name: TypeScript Build Check
        run: npm run build

      - name: Run PR suite against PostgreSQL
        # Bảng và dữ liệu gói cước được tạo bởi initDatabase() (CREATE TABLE IF NOT
        # EXISTS + INSERT ... ON CONFLICT) nên chỉ cần database rỗng là đủ.
        run: npm run test:unit:pr

name: Pipeline Tests (PostgreSQL thật + Redis thật + cổng độ phủ)

# Workflow này chạy theo lịch đêm (00:00 giờ Việt Nam), khi có PR vào `main` (mốc phát
# hành) và khi bấm chạy thủ công. Nó kiểm chứng đúng những thứ job PR không làm được:
#
#   1. nhóm test của PR chạy trên PostgreSQL THẬT (job PR chỉ chạy in-memory),
#   2. nhóm `redis` chạy trên Redis THẬT (job PR không dựng service container), và
#   3. cổng chất lượng độ phủ đo lại trên chính nhóm của PR.
#
# Nhóm test NẶNG (mở Chromium, ghép video bằng ffmpeg, chạy trọn pipeline) đã được tách
# sang `heavy-tests.yml` chạy hằng tuần: `security.test.ts` chạy pipeline thật 10 lần nên
# một mình nó ngốn hơn 30 phút trên runner CI — để trong workflow đêm thì không ai chờ nổi.
# Muốn chạy nặng tại chỗ: `npm run test:unit` / `npm run test:coverage` (cổng 70% dòng ghi
# trong scripts/coverage-thresholds.json).
on:
  pull_request:
    branches:
      - main
  schedule:
    # 17:00 UTC = 00:00 giờ Việt Nam, mỗi ngày.
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-coverage:
    name: PR suite + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Setup fonttools (pyftsubset)
        run: |
          pipx install "fonttools[woff,unicode]" || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonttools python3-brotli python3-zopfli)
          sudo apt-get install -y --no-install-recommends python3-fonttools python3-brotli || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          which pyftsubset || echo "pyftsubset not in PATH"

      - name: Cache Node Modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --prefer-offline

      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium & Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (when cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: TypeScript Build Check
        run: npm run build

      - name: Run PR suite with coverage gate
        # Cổng chất lượng lấy từ scripts/coverage-thresholds.json theo tên nhóm `pr`.
        # `pipefail` để cổng làm đỏ job chứ không bị `tee` che mất mã thoát.
        run: |
          set -o pipefail
          npm run test:coverage:pr 2>&1 | tee coverage-report.txt

      - name: Đưa báo cáo độ phủ vào Step Summary
        if: always()
        run: |
          {
            echo "### Độ phủ mã nguồn — nhóm \`pr\` (đo đêm)"
            echo ''
            echo '(ngưỡng: xem `scripts/coverage-thresholds.json`)'
            echo ''
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage-report.txt \
              | sed 's/^ℹ *//' | grep -v '^-\{5,\}' | cut -c1-140
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-nightly
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  postgres:
    name: PR suite on real PostgreSQL
    runs-on: ubuntu-latest
    # CI thường chỉ chạy in-memory ⇒ các nhánh truy vấn thật (admin, billing) không được
    # kiểm chứng. Job này chạy đúng nhóm của PR nhưng trên PostgreSQL thật.
    timeout-minutes: 30
    services:
      postgres:
        # Cùng phiên bản với docker-compose.yml của dự án.
        image: postgres:13
        env:
          POSTGRES_DB: vidtml
          POSTGRES_USER: vidtml
          # Database chỉ sống trong vài phút của job nên dùng trust auth thay vì đặt mật
          # khẩu: một "mật khẩu" viết thẳng trong file workflow không bảo vệ được gì mà lại
          # khiến máy quét bí mật (GitGuardian) đánh dấu cả PR là rò rỉ secret.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidtml -d vidtml"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vidtml@localhost:5432/vidtml
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Cache Node Modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --prefer-offline

      - name: TypeScript Build Check
        run: npm run build

      - name: Run PR suite against PostgreSQL
        # Bảng và dữ liệu gói cước được tạo bởi initDatabase() (CREATE TABLE IF NOT EXISTS
        # + INSERT ... ON CONFLICT) nên chỉ cần database rỗng là đủ.
        run: npm run test:unit:pr

  redis:
    name: Redis suite (hàng đợi BullMQ)
    runs-on: ubuntu-latest
    # Nhóm `redis` chỉ chạy được khi có Redis thật: hai hàng đợi BullMQ (render + webhook
    # thanh toán) là mã production nhưng trước đây chưa từng được chạy trong bộ test.
    # Chạy theo lịch đêm vì job PR không dựng service container.
    timeout-minutes: 30
    services:
      redis:
        # Cùng phiên bản với docker-compose.yml của dự án.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - name: Cache Node Modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --prefer-offline

      - name: TypeScript Build Check
        run: npm run build

      - name: Run Redis suite
        # Test tự tách database Redis riêng cho từng file (tests/redis/test-redis.ts) nên
        # chạy song song an toàn; không đo độ phủ ở đây vì nhóm này không nằm trong cổng
        # chất lượng (cổng 68% đo trên nhóm `pr`).
        run: npm run test:redis
